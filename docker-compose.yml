services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: nabiz, POSTGRES_USER: nabiz, POSTGRES_PASSWORD: nabiz }
    volumes: ["postgres_data:/var/lib/postgresql/data", "./packages/database/migrations:/docker-entrypoint-initdb.d:ro"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U nabiz"], interval: 5s, timeout: 3s, retries: 10 }
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: ["redis_data:/data"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10 }
  dashboard:
    build: { context: ., dockerfile: docker/Dockerfile.dashboard }
    env_file: .env
    ports: ["3000:3000"]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }
  worker:
    build: { context: ., dockerfile: docker/Dockerfile.worker }
    env_file: .env
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }
volumes: { postgres_data: {}, redis_data: {} }
